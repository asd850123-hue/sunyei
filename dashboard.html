<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山也餐盒 · 營運儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .brand { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1px; padding: 14px 0; }
    .brand span { color: #e8b84b; }
    .header-right { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
    .date-pill { color: rgba(255,255,255,0.5); font-size: 13px; }
    .btn-input {
      background: #e8b84b;
      color: #1a1a2e;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-input:hover { opacity: 0.85; }

    /* ── Store Tabs ── */
    .store-tabs {
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      padding: 0 24px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .store-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #888;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #1a1a2e; }
    .tab-btn.active { color: #1a1a2e; border-bottom-color: #e8b84b; font-weight: 700; }

    /* ── Pages ── */
    .page { display: none; padding: 24px; }
    .page.active { display: block; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #aaa; margin-bottom: 12px; }
    .divider { border: none; border-top: 1px solid #e8eaed; margin: 8px 0 28px; }

    /* ── KPI Cards (overview page) ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .kpi-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 20px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex; flex-direction: column; gap: 4px;
      border-left: 4px solid #e8eaed;
    }
    .kpi-card.yellow { border-left-color: #e8b84b; }
    .kpi-card.blue   { border-left-color: #4a90d9; }
    .kpi-card.green  { border-left-color: #3bb87b; }
    .kpi-card.red    { border-left-color: #e05c5c; }
    .kpi-card.purple { border-left-color: #8b5cf6; }
    .kpi-label { font-size: 11px; font-weight: 600; color: #aaa; letter-spacing: 0.5px; text-transform: uppercase; }
    .kpi-val { font-size: 28px; font-weight: 800; line-height: 1.15; color: #1a1a2e; }
    .kpi-sub { font-size: 12px; color: #bbb; margin-top: 2px; }
    .kpi-badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; width: fit-content; margin-top: 4px; }
    .kpi-badge.good { background: #e6f9f0; color: #2a9d6f; }
    .kpi-badge.warn { background: #fff4e0; color: #c98000; }
    .kpi-badge.bad  { background: #fdecea; color: #c0392b; }

    /* ── List Card (store page) ── */
    .list-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .list-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f2f5;
      display: flex; align-items: center; justify-content: space-between;
    }
    .list-card-header h3 { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .list-card-header span { font-size: 12px; color: #bbb; }
    .list-row {
      display: flex; align-items: center;
      padding: 13px 20px;
      border-bottom: 1px solid #f7f8fa;
    }
    .list-row:last-child { border-bottom: none; }
    .list-icon {
      width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-right: 14px;
    }
    .list-icon.yellow { background: #fff8e6; }
    .list-icon.blue   { background: #eaf2fc; }
    .list-icon.green  { background: #e8f9f2; }
    .list-icon.red    { background: #fdecea; }
    .list-icon.purple { background: #f3effe; }
    .list-label { flex: 1; font-size: 14px; color: #555; font-weight: 500; }
    .list-right { display: flex; align-items: center; gap: 10px; }
    .list-val { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .list-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .list-badge.good { background: #e6f9f0; color: #2a9d6f; }
    .list-badge.warn { background: #fff4e0; color: #c98000; }
    .list-badge.bad  { background: #fdecea; color: #c0392b; }
    .list-trend { font-size: 12px; font-weight: 700; }
    .list-sub-row {
      display: flex; align-items: center;
      padding: 8px 20px 8px 68px;
      border-bottom: 1px solid #f7f8fa;
      background: #fafbfc;
    }
    .list-sub-row:last-child { border-bottom: none; }
    .list-sub-label { flex: 1; font-size: 13px; color: #999; }
    .list-sub-val { font-size: 13px; font-weight: 600; color: #555; }
    .list-sub-pct { font-size: 12px; color: #bbb; margin-left: 8px; }
    .list-section-divider {
      padding: 8px 20px;
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: #bbb;
      background: #f7f8fa;
      border-bottom: 1px solid #f0f2f5;
    }

    /* ── Trend Chart ── */
    .chart-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .chart-card h3 {
      font-size: 11px; font-weight: 700; color: #aaa;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px;
    }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    /* ── Chart grid ── */
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; margin-bottom: 32px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-size: 14px; }
    thead tr { background: #1a1a2e; color: #fff; }
    thead th { padding: 12px 16px; text-align: left; font-weight: 500; font-size: 12px; letter-spacing: 0.5px; }
    tbody tr { border-bottom: 1px solid #f4f5f7; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafbfc; }
    tbody td { padding: 12px 16px; }
    .tbadge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .tbadge.good { background: #e6f9f0; color: #2a9d6f; }
    .tbadge.warn { background: #fff4e0; color: #c98000; }
    .tbadge.bad  { background: #fdecea; color: #c0392b; }

    /* ── Overview Cards ── */
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .store-mini-card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border-left: 4px solid #e8b84b; }
    .store-mini-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .store-mini-card h4 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mini-stat label { font-size: 11px; color: #aaa; display: block; }
    .mini-stat .v { font-size: 16px; font-weight: 700; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .modal-close { background: #f0f2f5; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e8eaed;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group select:focus { border-color: #e8b84b; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .success-msg { display: none; background: #e6f9f0; color: #2a9d6f; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; margin-top: 12px; }

    @media (max-width: 640px) {
      .page { padding: 14px; }
      header { padding: 0 14px; }
      .store-tabs { padding: 0 14px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="brand">山也餐盒 <span>·</span> 營運儀表板</div>
  <div class="header-right">
    <div class="date-pill" id="today-date"></div>
    <span id="sync-time" style="font-size:11px;color:#999;white-space:nowrap;"></span>
    <button class="btn-input" style="background:#444;" onclick="manualRefresh()">↻ 重新整理</button>
    <button class="btn-input" style="background:#555;" onclick="openMonthModal()">📋 月資料</button>
    <button class="btn-input" onclick="openModal()">＋ 今日營收</button>
  </div>
</header>

<!-- Store Tabs -->
<div class="store-tabs" id="store-tabs"></div>
<div id="pages"></div>

<!-- Input Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>填寫每日資料</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>門市</label>
      <select id="f-store">
        <option value="s1">六家店</option>
        <option value="s2">竹科店</option>
        <option value="s3">華興店</option>
      </select>
    </div>
    <div class="form-group">
      <label>日期</label>
      <input type="date" id="f-date" />
    </div>
    <div class="form-group">
      <label>自取收入 (NT$)</label>
      <input type="number" id="f-takeout" placeholder="0" min="0" oninput="calcTotal()" />
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>外送 (NT$)</label>
        <input type="number" id="f-delivery" placeholder="0" min="0" oninput="calcTotal()" />
      </div>
      <div class="form-group">
        <label>Uber Eats (NT$)</label>
        <input type="number" id="f-uber" placeholder="0" min="0" oninput="calcTotal()" />
      </div>
    </div>
    <div style="background:#f7f8fa;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:600;color:#555;">今日總營收</span>
      <span id="f-total-display" style="font-size:20px;font-weight:800;color:#1a1a2e;">$0</span>
    </div>
    <button class="btn-submit" onclick="submitData()">儲存資料</button>
    <div class="success-msg" id="success-msg">✓ 資料已儲存！</div>
  </div>
</div>

<!-- 月資料 Modal -->
<div class="modal-overlay" id="month-modal-overlay" onclick="closeMonthModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>填寫月資料</h2>
      <button class="modal-close" onclick="closeMonthModal()">✕</button>
    </div>
    <div class="form-group">
      <label>門市</label>
      <select id="m-store">
        <option value="s1">六家店</option>
        <option value="s2">竹科店</option>
        <option value="s3">華興店</option>
      </select>
    </div>
    <div class="form-group">
      <label>月份</label>
      <input type="month" id="m-month" />
    </div>
    <div class="form-group">
      <label>預估月營收目標 (NT$)</label>
      <input type="number" id="m-target" placeholder="0" min="0" />
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>熟客佔比 (%)</label>
        <input type="number" id="m-regular" placeholder="0" min="0" max="100" step="0.1" />
      </div>
      <div class="form-group">
        <label>客單價 (NT$)</label>
        <input type="number" id="m-ticket" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Google 評分</label>
        <input type="number" id="m-google" placeholder="4.5" min="1" max="5" step="0.1" />
      </div>
      <div class="form-group">
        <label>客訴率 (%)</label>
        <input type="number" id="m-complaint" placeholder="0" min="0" step="0.1" />
      </div>
      <div class="form-group">
        <label>物料成本 (NT$)</label>
        <input type="number" id="m-material" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>人事成本 (NT$)</label>
        <input type="number" id="m-labor" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>外場 QSC (分)</label>
        <input type="number" id="m-foh" placeholder="0" min="0" max="100" />
      </div>
      <div class="form-group">
        <label>內場 QSC (分)</label>
        <input type="number" id="m-boh" placeholder="0" min="0" max="100" />
      </div>
    </div>
    <div class="form-group">
      <label>門店健康度 (分)</label>
      <input type="number" id="m-health" placeholder="0" min="0" max="100" />
    </div>
    <button class="btn-submit" onclick="submitMonthData()">儲存月資料</button>
    <div class="success-msg" id="month-success-msg">✓ 月資料已儲存！</div>
  </div>
</div>

<script>
// ── 門店設定 ──
const STORES = [
  { id: 's1', name: '六家店' },
  { id: 's2', name: '竹科店' },
  { id: 's3', name: '華興店' },
];
const weekLabels = ['週一','週二','週三','週四','週五','週六','今日'];
let charts = {};

// ── 日期工具 ──
function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function fmtDate(d) {
  return d.slice(5).replace('-','/');
}

// ── Google Sheets API ──
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzH_t64QL9BjY9BMqAMpm-8a9i93VqBfICP4Tx8mqlWXHBwVIrNLpCu2tiXT5QpLF3Ltw/exec';
let _cache = null;

// 把任意日期字串正規化為 yyyy-MM-dd
function normalizeDate(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; // 已是標準格式
  const d = new Date(s);
  if (isNaN(d.getTime())) return null;
  return d.toLocaleDateString('sv-SE'); // sv-SE locale 輸出 yyyy-MM-dd
}

// 把 remote 資料的日期 key 全部正規化
function normalizeRemote(remote) {
  const out = {};
  for (const storeId in remote) {
    out[storeId] = {};
    for (const dateKey in remote[storeId]) {
      const normalized = normalizeDate(dateKey);
      if (normalized) out[storeId][normalized] = remote[storeId][dateKey];
    }
  }
  return out;
}

async function fetchAllData() {
  const local = JSON.parse(localStorage.getItem('sanye_cache') || '{}');
  try {
    const url = WEBAPP_URL + '?t=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const json = await res.json();
    const remote = normalizeRemote(json.data || {});

    // 合併：以 remote 為主，local 有但 remote 沒有的也保留
    const merged = JSON.parse(JSON.stringify(remote));
    for (const storeId in local) {
      if (!merged[storeId]) merged[storeId] = {};
      for (const date in local[storeId]) {
        if (!merged[storeId][date]) {
          merged[storeId][date] = local[storeId][date];
        }
      }
    }
    _cache = merged;
    localStorage.setItem('sanye_cache', JSON.stringify(_cache));
    updateSyncTime();
  } catch (e) {
    _cache = local;
  }
  return _cache;
}

function updateSyncTime() {
  const el = document.getElementById('sync-time');
  if (el) el.textContent = '上次同步：' + new Date().toLocaleTimeString('zh-TW');
}

// 每 60 秒自動重新整理
setInterval(async () => {
  await fetchAllData();
  renderAll();
}, 60000);

function getData() {
  return _cache || JSON.parse(localStorage.getItem('sanye_cache') || '{}');
}

function getStoreRecords(storeId) {
  return getData()[storeId] || {};
}

async function setRecord(storeId, date, record) {
  // 先更新本地快取，讓 UI 即時反應
  if (!_cache) _cache = {};
  if (!_cache[storeId]) _cache[storeId] = {};
  _cache[storeId][date] = record;
  localStorage.setItem('sanye_cache', JSON.stringify(_cache));

  // 用 GET + 參數傳送（避免 CORS 問題）
  const url = new URL(WEBAPP_URL);
  url.searchParams.set('action', 'write');
  url.searchParams.set('storeId', storeId);
  url.searchParams.set('date', date);
  url.searchParams.set('rev', record.rev);
  url.searchParams.set('delivery', record.delivery);
  url.searchParams.set('uber', record.uber);
  url.searchParams.set('cost', record.cost);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    await fetch(url.toString(), { mode: 'no-cors', signal: controller.signal });
  } catch (e) {
    console.warn('傳送失敗（資料已存本地）:', e.message);
  } finally {
    clearTimeout(timer);
  }
}

// ── 取得最近 N 天資料 ──
function getLastN(storeId, n) {
  const records = getStoreRecords(storeId);
  const days = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toLocaleDateString('sv-SE');
    days.push({ date: fmtDate(key), key, ...(records[key] || { rev:0, delivery:0, uber:0, cost:0 }) });
  }
  return days;
}
function getLast7(storeId)  { return getLastN(storeId, 7); }
function getLast30(storeId) { return getLastN(storeId, 30); }
function getTodayKpi(storeId) {
  const records = getStoreRecords(storeId);
  return records[todayStr()] || { rev:0, delivery:0, uber:0, cost:0 };
}
// 取昨日資料（用於和今日比較）
function getYesterdayKpi(storeId) {
  const records = getStoreRecords(storeId);
  const d = new Date(); d.setDate(d.getDate() - 1);
  return records[d.toLocaleDateString('sv-SE')] || { rev:0, delivery:0, uber:0, cost:0 };
}
// 取最近一筆有資料的 kpi 及日期（今日無資料時往前找）
function getLatestKpi(storeId) {
  const records = getStoreRecords(storeId);
  // 先看今日
  const today = todayStr();
  if (records[today] && records[today].rev > 0) {
    return { kpi: records[today], date: today, isToday: true };
  }
  // 往前最多 60 天找最近一筆
  for (let i = 1; i <= 60; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toLocaleDateString('sv-SE');
    if (records[key] && records[key].rev > 0) {
      return { kpi: records[key], date: key, isToday: false };
    }
  }
  return { kpi: { rev:0, delivery:0, uber:0, cost:0 }, date: today, isToday: true };
}

// ── 切換 Tab ──
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

// ── 渲染全覽頁 ──
function renderAllPage() {
  const el = document.getElementById('page-all');
  const allKpis = STORES.map(s => ({ ...s, kpi: getTodayKpi(s.id) }));
  const totalRev  = allKpis.reduce((s,x)=>s+x.kpi.rev,0);
  const totalDeli = allKpis.reduce((s,x)=>s+x.kpi.delivery,0);
  const totalUber = allKpis.reduce((s,x)=>s+x.kpi.uber,0);
  const totalCost = allKpis.reduce((s,x)=>s+x.kpi.cost,0);

  const miniCards = allKpis.map(s => {

    return `<div class="store-mini-card" onclick="switchTab('${s.id}')">

        <div class="mini-stat"><label>Uber Eats</label><div class="v">$${s.kpi.uber.toLocaleString()}</div></div>

  el.innerHTML = `

    <div class="kpi-grid">
      <div class="kpi-card yellow"><div class="kpi-icon">💰</div><div class="kpi-label">今日總營收</div><div class="kpi-val">$${totalRev.toLocaleString()}</div><div class="kpi-sub">六間店合計</div></div>

// ── 趨勢變化箭頭 ──
function trendBadge(curr, prev) {
  if (!prev || prev === 0) return '';
  const pct = ((curr - prev) / prev * 100).toFixed(1);
  if (Math.abs(pct) < 1) return `<span style="font-size:11px;color:#aaa">持平</span>`;
  const up = pct > 0;
  return `<span style="font-size:11px;font-weight:700;color:${up?'#3bb87b':'#e05c5c'}">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}

// ── 渲染單店頁 ──

    .filter(([d]) => d.startsWith(ym))
    .reduce((sum, [, r]) => sum + r.rev + r.delivery + r.uber, 0);
  const target = monthly.target || 0;
  const achieve = target ? ((monthTotal / target) * 100).toFixed(1) : null;
  const achieveClass = achieve === null ? '' : achieve >= 100 ? 'good' : achieve >= 80 ? 'warn' : 'bad';

  const dash = v => v !== undefined && v !== null && v !== 0 ? v : null;
  const fmt$ = v => v !== null ? '$' + Number(v).toLocaleString() : '—';
  const fmtPct = v => v !== null ? v + '%' : '—';
  const fmtScore = v => v !== null ? v + ' 分' : '—';
  const fmtRating = v => v !== null ? '★ ' + v : '—';

  const rows = [...last7].reverse().map(d => {
    const dtotal = d.rev + d.delivery + d.uber;
    const isT = d.key === todayStr();
    return `<tr${isT ? ' style="background:#fffdf0"' : ''}>
      <td>${d.date}${isT ? ' <span style="font-size:11px;color:#e8b84b;font-weight:700">今日</span>' : ''}</td>
      <td>$${dtotal.toLocaleString()}</td>
      <td>$${d.rev.toLocaleString()}</td>
      <td>$${d.delivery.toLocaleString()}</td>
      <td>$${d.uber.toLocaleString()}</td>

  }).join('');

  el.innerHTML = `
    <div class="list-card">
      <div class="list-card-header">
        <h3>${store.name} · ${isToday ? '今日數值' : '最近紀錄'}</h3>

      </div>

        <div class="list-icon yellow">💰</div>
        <div class="list-label">總營收</div>
        <div class="list-right">
          <div class="list-val">$${total.toLocaleString()}</div>
          ${trendBadge(total, prevTotal)}
        </div>
      </div>
      <div class="list-sub-row">
        <div class="list-sub-label">自取</div>
        <div class="list-sub-val">$${kpi.rev.toLocaleString()}</div>
        <div class="list-sub-pct">${takeoutPct}%</div>
      </div>
      <div class="list-sub-row">
        <div class="list-sub-label">外送</div>
        <div class="list-sub-val">$${kpi.delivery.toLocaleString()}</div>
        <div class="list-sub-pct">${delivPct}%</div>
      </div>
      <div class="list-sub-row">
        <div class="list-sub-label">Uber Eats</div>
        <div class="list-sub-val">$${kpi.uber.toLocaleString()}</div>
        <div class="list-sub-pct">${uberPct}%</div>
      </div>

      <div class="list-row">
        <div class="list-icon blue">📈</div>
        <div class="list-label">月累計 / 達成率</div>
        <div class="list-right">
          <div class="list-val">$${monthTotal.toLocaleString()}</div>
          ${achieve !== null ? `<span class="list-badge ${achieveClass}">${achieve}%</span>` : '<span style="font-size:12px;color:#bbb">未設目標</span>'}
        </div>
      </div>

      <div class="list-section-divider">月資料</div>

      <div class="list-row">
        <div class="list-icon green">👥</div>
        <div class="list-label">熟客佔比</div>
        <div class="list-right"><div class="list-val">${fmtPct(dash(monthly.regular))}</div></div>
      </div>
      <div class="list-row">
        <div class="list-icon yellow">🧾</div>
        <div class="list-label">客單價</div>
        <div class="list-right"><div class="list-val">${fmt$(dash(monthly.ticket))}</div></div>
      </div>
      <div class="list-row">
        <div class="list-icon green">⭐</div>
        <div class="list-label">Google 評分</div>
        <div class="list-right"><div class="list-val">${fmtRating(dash(monthly.google))}</div></div>
      </div>
      <div class="list-row">
        <div class="list-icon purple">📦</div>
        <div class="list-label">物料成本</div>
        <div class="list-right"><div class="list-val">${fmt$(dash(monthly.material))}</div></div>
      </div>
      <div class="list-row">
        <div class="list-icon blue">👤</div>
        <div class="list-label">人事成本</div>
        <div class="list-right"><div class="list-val">${fmt$(dash(monthly.labor))}</div></div>
      </div>
      <div class="list-row">

      </div>
      <div class="list-row">
        <div class="list-icon green">❤️</div>
        <div class="list-label">門店健康度</div>
        <div class="list-right"><div class="list-val">${fmtScore(dash(monthly.health))}</div></div>

    <div class="chart-card">

          <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div>外送</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3bb87b"></div>Uber Eats</div>

        <tbody>${rows}</tbody>
      </table>

  // 銷毀舊圖
  if (charts['trend-' + store.id]) charts['trend-' + store.id].destroy();

  const labels   = last30.map(d => d.date);
  const todayIdx = last30.findIndex(d => d.key === todayStr());

  const dotRadius = (ctx) => ctx.dataIndex === todayIdx ? 7 : 4;
  const dotStyle  = (ctx) => ctx.dataIndex === todayIdx ? 'rectRounded' : 'circle';

  charts['trend-' + store.id] = new Chart(
    document.getElementById('chart-trend-' + store.id), {
    type: 'line',
    data: {
      labels,
      datasets: [

          borderWidth: 2, fill: false, tension: 0.35,
          pointRadius: last30.map((_, i) => i === todayIdx ? 7 : 4),
          pointBackgroundColor: last30.map((_, i) => i === todayIdx ? '#e8b84b' : '#fff'),

          label: '外送', data: last30.map(d => d.delivery),

          ticks: {
            maxTicksLimit: 10,
            font: { size: 11 },
            color: '#bbb',

          ticks: {
            callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(0)+'k' : v),
            font: { size: 11 },
            color: '#bbb',

// ── 月資料 ──
function getMonthStr() { return todayStr().slice(0,7); }

function getMonthlyRecord(storeId, ym) {
  const all = JSON.parse(localStorage.getItem('sanye_monthly') || '{}');
  return (all[storeId] && all[storeId][ym]) || {};
}
function setMonthlyRecord(storeId, ym, data) {
  const all = JSON.parse(localStorage.getItem('sanye_monthly') || '{}');
  if (!all[storeId]) all[storeId] = {};
  all[storeId][ym] = { ...getMonthlyRecord(storeId, ym), ...data };
  localStorage.setItem('sanye_monthly', JSON.stringify(all));
}

// ── 每日 Modal ──
function calcTotal() {
  const t = parseInt(document.getElementById('f-takeout').value) || 0;
  const d = parseInt(document.getElementById('f-delivery').value) || 0;
  const u = parseInt(document.getElementById('f-uber').value) || 0;
  document.getElementById('f-total-display').textContent = '$' + (t + d + u).toLocaleString();
}

function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('success-msg').style.display = 'none';
  const active = document.querySelector('.tab-btn.active');
  const id = active?.dataset.id;
  if (id && id !== 'all') document.getElementById('f-store').value = id;
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function closeModalOnBg(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

async function submitData() {
  const storeId  = document.getElementById('f-store').value;
  const date     = document.getElementById('f-date').value;
  const rev      = parseInt(document.getElementById('f-takeout').value) || 0;
  const delivery = parseInt(document.getElementById('f-delivery').value) || 0;
  const uber     = parseInt(document.getElementById('f-uber').value) || 0;

  if (!date) { alert('請選擇日期'); return; }

  const btn = document.querySelector('#modal-overlay .btn-submit');
  btn.textContent = '儲存中...';
  btn.disabled = true;

  await setRecord(storeId, date, { rev, delivery, uber, cost: 0 });

  btn.textContent = '儲存資料';
  btn.disabled = false;

  ['f-takeout','f-delivery','f-uber'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-total-display').textContent = '$0';

  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 2500);

  renderAll();
}

// ── 月資料 Modal ──
function openMonthModal() {
  document.getElementById('month-modal-overlay').classList.add('open');
  document.getElementById('month-success-msg').style.display = 'none';
  document.getElementById('m-month').value = getMonthStr();
  const active = document.querySelector('.tab-btn.active');
  const id = active?.dataset.id;
  if (id && id !== 'all') {
    document.getElementById('m-store').value = id;
    loadMonthFormData(id, getMonthStr());
  }
}
function closeMonthModal() {
  document.getElementById('month-modal-overlay').classList.remove('open');
}
function closeMonthModalOnBg(e) {
  if (e.target === document.getElementById('month-modal-overlay')) closeMonthModal();
}
function loadMonthFormData(storeId, ym) {
  const d = getMonthlyRecord(storeId, ym);
  const set = (id, val) => { if (val) document.getElementById(id).value = val; else document.getElementById(id).value = ''; };
  set('m-target', d.target); set('m-regular', d.regular); set('m-ticket', d.ticket);
  set('m-google', d.google); set('m-complaint', d.complaint); set('m-material', d.material);
  set('m-labor', d.labor); set('m-foh', d.foh); set('m-boh', d.boh); set('m-health', d.health);
}
function submitMonthData() {
  const storeId = document.getElementById('m-store').value;
  const ym      = document.getElementById('m-month').value;
  const num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? undefined : v; };
  const data = {
    target: num('m-target'), regular: num('m-regular'), ticket: num('m-ticket'),
    google: num('m-google'), complaint: num('m-complaint'), material: num('m-material'),
    labor: num('m-labor'), foh: num('m-foh'), boh: num('m-boh'), health: num('m-health'),
  };
  Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
  setMonthlyRecord(storeId, ym, data);

  const msg = document.getElementById('month-success-msg');
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; closeMonthModal(); renderAll(); }, 1500);
}

// ── 初始渲染 ──
function renderAll() {
  renderAllPage();
  STORES.forEach(renderStorePage);
}

async function manualRefresh() {
  const btn = document.querySelector('button[onclick="manualRefresh()"]');
  if (btn) { btn.textContent = '同步中...'; btn.disabled = true; }
  await fetchAllData();
  renderAll();
  if (btn) { btn.textContent = '↻ 重新整理'; btn.disabled = false; }
}

// ── 啟動：先從 Google Sheets 拉資料再渲染 ──
(async () => {
  await fetchAllData();
  renderAll();
})();
</script>
